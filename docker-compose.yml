services:
  ai-proxy:
    build: .
    container_name: ai-proxy
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - PORT=${PORT:-3003}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - UPSTREAM_TIMEOUT_MS=${UPSTREAM_TIMEOUT_MS:-60000}
    ports:
      - "${PORT:-3003}:${PORT:-3003}"
    restart: unless-stopped
